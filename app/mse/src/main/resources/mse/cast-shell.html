<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>airplay-cast</title>
  <style>
    :root { color-scheme: dark; --bar: #1a1a1a; --fg: #e8e8e8; --accent: #3d8bfd; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #000; color: var(--fg); font: 14px/1.3 system-ui, sans-serif; }
    #bar {
      display: flex; gap: 8px; align-items: center;
      height: 44px; padding: 6px 10px; background: var(--bar); border-bottom: 1px solid #333;
    }
    #bar input {
      flex: 1; height: 30px; border-radius: 6px; border: 1px solid #444;
      background: #111; color: var(--fg); padding: 0 10px;
    }
    #bar button {
      height: 30px; padding: 0 12px; border-radius: 6px; border: 0;
      background: #333; color: var(--fg); cursor: pointer;
    }
    #bar button.primary { background: var(--accent); color: #fff; }
    #status { min-width: 7em; font-size: 12px; opacity: 0.8; }
    #frame { width: 100%; height: calc(100% - 44px); border: 0; background: #fff; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="back" title="Back">←</button>
    <button id="fwd" title="Forward">→</button>
    <input id="url" type="url" spellcheck="false" placeholder="https://…"/>
    <button id="go" class="primary">Go</button>
    <span id="status">idle</span>
  </div>
  <iframe id="frame" src="about:blank" allow="autoplay; fullscreen; clipboard-read; clipboard-write"></iframe>
<script>
(function () {
  const urlInput = document.getElementById('url');
  const frame = document.getElementById('frame');
  const statusEl = document.getElementById('status');
  let controlWs = null;
  let videoWs = null;
  let captureStream = null;
  let videoTrack = null;
  let encoder = null;
  let captureTimer = null;
  let canvas = null;
  let ctx = null;
  let videoEl = null;
  let spsPpsAnnexB = null;
  let casting = false;
  let frameIndex = 0;

  function setStatus(s) { statusEl.textContent = s; }

  function normalizeUrl(raw) {
    var u = (raw || '').trim();
    if (!u) return '';
    if (!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u)) u = 'https://' + u;
    return u;
  }

  function navigate(raw) {
    var u = normalizeUrl(raw);
    if (!u) return;
    urlInput.value = u;
    try { frame.src = u; } catch (e) { setStatus('nav err'); }
  }

  document.getElementById('go').onclick = function () { navigate(urlInput.value); };
  document.getElementById('back').onclick = function () {
    try { frame.contentWindow.history.back(); } catch (e) {}
  };
  document.getElementById('fwd').onclick = function () {
    try { frame.contentWindow.history.forward(); } catch (e) {}
  };
  urlInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') navigate(urlInput.value);
  });

  function emitControl(obj) {
    if (controlWs && controlWs.readyState === 1) controlWs.send(JSON.stringify(obj));
  }

  function avccToAnnexB(data) {
    var u8 = data instanceof Uint8Array ? data : new Uint8Array(data);
    var out = [];
    var i = 0;
    while (i + 4 <= u8.length) {
      var n = (u8[i] << 24) | (u8[i + 1] << 16) | (u8[i + 2] << 8) | u8[i + 3];
      i += 4;
      if (n <= 0 || i + n > u8.length) break;
      out.push(0, 0, 0, 1);
      for (var j = 0; j < n; j++) out.push(u8[i + j]);
      i += n;
    }
    return new Uint8Array(out);
  }

  function extractSpsPps(description) {
    // AVCDecoderConfigurationRecord → Annex-B SPS/PPS
    var d = new Uint8Array(description);
    if (d.length < 7) return null;
    var out = [];
    var offset = 5;
    var numSps = d[offset++] & 0x1f;
    for (var s = 0; s < numSps; s++) {
      if (offset + 2 > d.length) return null;
      var len = (d[offset] << 8) | d[offset + 1];
      offset += 2;
      out.push(0, 0, 0, 1);
      for (var i = 0; i < len && offset + i < d.length; i++) out.push(d[offset + i]);
      offset += len;
    }
    if (offset >= d.length) return new Uint8Array(out);
    var numPps = d[offset++];
    for (var p = 0; p < numPps; p++) {
      if (offset + 2 > d.length) break;
      var plen = (d[offset] << 8) | d[offset + 1];
      offset += 2;
      out.push(0, 0, 0, 1);
      for (var j = 0; j < plen && offset + j < d.length; j++) out.push(d[offset + j]);
      offset += plen;
    }
    return new Uint8Array(out);
  }

  function sendAnnexB(bytes) {
    if (!videoWs || videoWs.readyState !== 1 || !bytes || !bytes.length) return;
    videoWs.send(bytes);
  }

  async function ensureEncoder(width, height) {
    if (encoder) {
      try { encoder.close(); } catch (e) {}
      encoder = null;
    }
    spsPpsAnnexB = null;
    if (typeof VideoEncoder === 'undefined') {
      throw new Error('VideoEncoder unsupported');
    }
    encoder = new VideoEncoder({
      output: function (chunk, meta) {
        if (meta && meta.decoderConfig && meta.decoderConfig.description) {
          spsPpsAnnexB = extractSpsPps(meta.decoderConfig.description);
        }
        var buf = new ArrayBuffer(chunk.byteLength);
        chunk.copyTo(buf);
        var annex = avccToAnnexB(buf);
        if (chunk.type === 'key' && spsPpsAnnexB && spsPpsAnnexB.length) {
          var merged = new Uint8Array(spsPpsAnnexB.length + annex.length);
          merged.set(spsPpsAnnexB, 0);
          merged.set(annex, spsPpsAnnexB.length);
          sendAnnexB(merged);
        } else {
          sendAnnexB(annex);
        }
      },
      error: function (e) {
        emitControl({ event: 'error', message: 'encoder: ' + e });
        setStatus('enc err');
      }
    });
    // High@L4.0 — level 3.0 (avc1.42E01E) rejects ~1152x720 coded area on Chromium.
    function even(n) { n = n | 0; return n % 2 === 0 ? n : n - 1; }
    var w = even(Math.min(1280, Math.max(2, width | 0)));
    var h = even(Math.min(720, Math.max(2, height | 0)));
    await encoder.configure({
      codec: 'avc1.640028',
      width: w,
      height: h,
      bitrate: 3_500_000,
      framerate: 30,
      avc: { format: 'avc' },
      latencyMode: 'realtime',
      hardwareAcceleration: 'prefer-hardware'
    });
  }

  function stopCapturePipeline() {
    casting = false;
    if (captureTimer) { clearInterval(captureTimer); captureTimer = null; }
    if (encoder) { try { encoder.close(); } catch (e) {} encoder = null; }
    if (videoTrack) { try { videoTrack.stop(); } catch (e) {} videoTrack = null; }
    if (captureStream) {
      try { captureStream.getTracks().forEach(function (t) { t.stop(); }); } catch (e) {}
      captureStream = null;
    }
    if (videoEl) { try { videoEl.srcObject = null; } catch (e) {} videoEl = null; }
    canvas = null;
    ctx = null;
    setStatus('idle');
  }

  async function startCapture() {
    if (casting) return;
    setStatus('capturing…');
    try {
      // Capture THIS tab only (shell + iframe pixels), not the whole desktop.
      var opts = {
        video: {
          displaySurface: 'browser',
          frameRate: 30,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false,
        preferCurrentTab: true,
        selfBrowserSurface: 'include',
        surfaceSwitching: 'exclude',
        systemAudio: 'exclude'
      };
      captureStream = await navigator.mediaDevices.getDisplayMedia(opts);
      videoTrack = captureStream.getVideoTracks()[0];
      if (!videoTrack) throw new Error('no video track');
      videoTrack.addEventListener('ended', function () {
        stopCapturePipeline();
        emitControl({ event: 'captureEnded' });
      });

      videoEl = document.createElement('video');
      videoEl.muted = true;
      videoEl.playsInline = true;
      videoEl.srcObject = captureStream;
      await videoEl.play();

      var settings = videoTrack.getSettings ? videoTrack.getSettings() : {};
      var w = settings.width || videoEl.videoWidth || 1280;
      var h = settings.height || videoEl.videoHeight || 720;
      canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      ctx = canvas.getContext('2d', { alpha: false });
      await ensureEncoder(w, h);

      casting = true;
      frameIndex = 0;
      setStatus('casting');
      emitControl({ event: 'captureStarted', width: w, height: h });

      captureTimer = setInterval(async function () {
        if (!casting || !encoder || encoder.state !== 'configured') return;
        try {
          if (videoEl.videoWidth > 0) {
            if (canvas.width !== videoEl.videoWidth || canvas.height !== videoEl.videoHeight) {
              canvas.width = videoEl.videoWidth;
              canvas.height = videoEl.videoHeight;
              await ensureEncoder(canvas.width, canvas.height);
            }
          }
          ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
          var ts = performance.now() * 1000;
          var frame = new VideoFrame(canvas, { timestamp: ts });
          var key = (frameIndex++ % 30) === 0;
          encoder.encode(frame, { keyFrame: key });
          frame.close();
        } catch (e) {
          emitControl({ event: 'error', message: 'frame: ' + e });
        }
      }, 33);
    } catch (e) {
      stopCapturePipeline();
      emitControl({ event: 'error', message: 'capture: ' + e });
      setStatus('denied');
    }
  }

  function connectVideo(wsUrl) {
    if (videoWs) { try { videoWs.close(); } catch (e) {} }
    videoWs = new WebSocket(wsUrl);
    videoWs.binaryType = 'arraybuffer';
    videoWs.onopen = function () { emitControl({ event: 'videoWsOpen' }); };
    videoWs.onclose = function () { emitControl({ event: 'videoWsClosed' }); };
  }

  function onCommand(msg) {
    if (!msg || !msg.cmd) return;
    if (msg.cmd === 'startCast') {
      if (msg.videoWsUrl) connectVideo(msg.videoWsUrl);
      if (msg.homeUrl) navigate(msg.homeUrl);
      startCapture();
    } else if (msg.cmd === 'stopCast') {
      stopCapturePipeline();
      if (videoWs) { try { videoWs.close(); } catch (e) {} videoWs = null; }
    } else if (msg.cmd === 'navigate') {
      navigate(msg.url || '');
    }
  }

  function connectControl() {
    var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/cast-control';
    controlWs = new WebSocket(url);
    controlWs.onopen = function () {
      emitControl({ event: 'ready' });
      setStatus('ready');
    };
    controlWs.onclose = function () {
      setStatus('reconnecting');
      setTimeout(connectControl, 500);
    };
    controlWs.onmessage = function (ev) {
      try { onCommand(JSON.parse(ev.data)); }
      catch (e) { emitControl({ event: 'error', message: 'bad cmd: ' + e }); }
    };
  }

  // Default home for a useful cast session.
  urlInput.value = 'https://www.youtube.com';
  connectControl();
})();
</script>
</body>
</html>
