<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>airplay-mse</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #stage {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    video.idle { visibility: hidden; }
  </style>
  <script src="jmuxer.min.js"></script>
  <script src="hls.min.js"></script>
</head>
<body>
<div id="stage"><video id="player" autoplay playsinline></video></div>
<script>
(function () {
  const video = document.getElementById('player');
  let hls = null;
  let jmuxer = null;
  let mirrorWs = null;
  let audioWs = null;
  let controlWs = null;
  let mode = 'idle';
  let playbackTimer = null;
  let mirrorFps = 60;
  let lastSpsKey = null;
  let hlsEpoch = 0;
  let videoErrorHooked = false;

  // Decoded mirror/Music PCM → Web Audio (AAC-ELD/ALAC cannot go through MSE).
  let audioCtx = null;
  let gainNode = null;
  let nextAudioTime = 0;
  let audioSampleRate = 44100;
  let audioChannels = 2;
  let pcmBytesQueued = 0;
  let volumeLinear = 1;

  // Test hooks (Playwright).
  window.__mse = {
    mode: function () { return mode; },
    pcmBytesQueued: function () { return pcmBytesQueued; },
    hasJmuxer: function () { return !!jmuxer; },
    hasHls: function () { return !!hls; },
    videoReadyState: function () { return video.readyState; }
  };

  function emit(obj) {
    if (controlWs && controlWs.readyState === 1) {
      controlWs.send(JSON.stringify(obj));
    }
  }

  function log(msg) {
    emit({ event: 'log', message: String(msg) });
    console.log('[airplay-mse]', msg);
  }

  function isAbortError(err) {
    return err && (err.name === 'AbortError' || String(err).indexOf('AbortError') >= 0);
  }

  function playSafe() {
    var p = video.play();
    if (p && p.catch) {
      p.catch(function (e) {
        if (isAbortError(e)) {
          log('play aborted (ignored)');
          return;
        }
        emit({ event: 'error', message: 'play: ' + e });
      });
    }
  }

  function ensureAudioGraph(sampleRate, channels) {
    audioSampleRate = sampleRate || 44100;
    audioChannels = channels || 2;
    if (!audioCtx || audioCtx.sampleRate !== audioSampleRate) {
      try { if (audioCtx) audioCtx.close(); } catch (e) {}
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: audioSampleRate });
      gainNode = audioCtx.createGain();
      gainNode.gain.value = volumeLinear;
      gainNode.connect(audioCtx.destination);
      nextAudioTime = 0;
      log('audio context ' + audioSampleRate + 'Hz x' + audioChannels);
    } else if (gainNode) {
      gainNode.gain.value = volumeLinear;
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
  }

  function stopPcmAudio() {
    if (audioWs) {
      try { audioWs.close(); } catch (e) {}
      audioWs = null;
    }
    nextAudioTime = 0;
    try { if (audioCtx) audioCtx.suspend(); } catch (e) {}
  }

  function feedPcm(arrayBuffer) {
    if (!audioCtx || !gainNode || !arrayBuffer || arrayBuffer.byteLength < 2) return;
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
    var bytes = new Uint8Array(arrayBuffer);
    // Align to sample frame (channels * 2 bytes).
    var frameBytes = audioChannels * 2;
    var usable = bytes.byteLength - (bytes.byteLength % frameBytes);
    if (usable < frameBytes) return;
    var view = new DataView(arrayBuffer, 0, usable);
    var frames = usable / frameBytes;
    var buffer = audioCtx.createBuffer(audioChannels, frames, audioSampleRate);
    for (var ch = 0; ch < audioChannels; ch++) {
      var plane = buffer.getChannelData(ch);
      for (var i = 0; i < frames; i++) {
        plane[i] = view.getInt16((i * audioChannels + ch) * 2, true) / 32768;
      }
    }
    var src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.connect(gainNode);
    var now = audioCtx.currentTime;
    if (nextAudioTime < now + 0.02) {
      nextAudioTime = now + 0.02;
    }
    src.start(nextAudioTime);
    nextAudioTime += buffer.duration;
    pcmBytesQueued += usable;
    // Cap scheduling horizon to avoid unbounded latency under burst.
    if (nextAudioTime > now + 0.75) {
      nextAudioTime = now + 0.25;
    }
  }

  function connectAudio(wsUrl) {
    if (audioWs) {
      try { audioWs.close(); } catch (e) {}
      audioWs = null;
    }
    if (!wsUrl) return;
    audioWs = new WebSocket(wsUrl);
    audioWs.binaryType = 'arraybuffer';
    audioWs.onopen = function () { log('audio ws open'); };
    audioWs.onclose = function () { log('audio ws closed'); };
    audioWs.onerror = function () { emit({ event: 'error', message: 'audio websocket error' }); };
    audioWs.onmessage = function (ev) {
      if (ev.data instanceof ArrayBuffer) feedPcm(ev.data);
    };
  }

  function stopHls(epoch) {
    if (epoch != null && epoch !== hlsEpoch) {
      log('stopHls ignored stale epoch ' + epoch + ' (current ' + hlsEpoch + ')');
      return;
    }
    if (hls) {
      try { hls.detachMedia(); } catch (e) {}
      try { hls.destroy(); } catch (e) {}
      hls = null;
    }
    try {
      video.pause();
      video.removeAttribute('src');
      video.srcObject = null;
      video.load();
    } catch (e) {}
  }

  function destroyJmuxer() {
    if (jmuxer) {
      try { jmuxer.destroy(); } catch (e) {}
      jmuxer = null;
    }
    lastSpsKey = null;
  }

  function stopMirror() {
    if (mirrorWs) {
      try { mirrorWs.close(); } catch (e) {}
      mirrorWs = null;
    }
    destroyJmuxer();
    stopPcmAudio();
  }

  function stopAll() {
    stopHls(hlsEpoch);
    stopMirror();
    mode = 'idle';
    video.classList.add('idle');
  }

  function markActive() {
    video.classList.remove('idle');
  }

  function reportPlayback() {
    // Duration/position hints only — Java owns rate for /playback-info.
    var duration = isFinite(video.duration) ? video.duration : 0;
    var position = video.currentTime || 0;
    if (mode === 'hls' && video.ended && duration > 0) {
      position = duration;
    }
    emit({ event: 'playback', duration: duration, position: position, rate: 0, mode: mode });
  }

  video.addEventListener('ended', function () {
    if (mode === 'hls') {
      log('video ended');
      var duration = isFinite(video.duration) ? video.duration : 0;
      emit({ event: 'playback', duration: duration, position: duration, rate: 1, mode: 'hls' });
      emit({ event: 'ended' });
    }
  });

  function spsKeyFromAnnexB(bytes) {
    var i = 0;
    var key = null;
    while (i + 4 < bytes.length) {
      var sc = 0;
      if (bytes[i] === 0 && bytes[i + 1] === 0 && bytes[i + 2] === 0 && bytes[i + 3] === 1) sc = 4;
      else if (bytes[i] === 0 && bytes[i + 1] === 0 && bytes[i + 2] === 1) sc = 3;
      else { i++; continue; }
      var start = i + sc;
      var j = start;
      while (j + 3 < bytes.length) {
        if (bytes[j] === 0 && bytes[j + 1] === 0 && (bytes[j + 2] === 1 || (bytes[j + 2] === 0 && bytes[j + 3] === 1))) break;
        j++;
      }
      if (start < bytes.length) {
        var nalType = bytes[start] & 0x1f;
        if (nalType === 7) {
          key = bytes.subarray(start, j).join(',');
        }
      }
      i = j > start ? j : start + 1;
    }
    return key;
  }

  function createJmuxer(fps) {
    destroyJmuxer();
    try {
      video.pause();
      video.removeAttribute('src');
      video.srcObject = null;
      video.load();
    } catch (e) {}
    jmuxer = new JMuxer({
      node: 'player',
      mode: 'video',
      flushingTime: 0,
      fps: Math.max(1, Number(fps) || 60),
      debug: false
    });
  }

  function feedMirror(bytes) {
    if (!jmuxer) return;
    var spsKey = spsKeyFromAnnexB(bytes);
    if (spsKey && lastSpsKey && spsKey !== lastSpsKey) {
      log('SPS changed (rotate/resolution); recreating jmuxer');
      createJmuxer(mirrorFps);
    }
    if (spsKey) lastSpsKey = spsKey;
    try {
      jmuxer.feed({ video: bytes });
    } catch (e) {
      emit({ event: 'error', message: 'jmuxer feed: ' + e });
      try {
        createJmuxer(mirrorFps);
        if (spsKey) lastSpsKey = spsKey;
        jmuxer.feed({ video: bytes });
        log('jmuxer recovered after feed error');
      } catch (e2) {
        emit({ event: 'error', message: 'jmuxer recover failed: ' + e2 });
      }
    }
  }

  function startMirror(wsUrl, audioWsUrl, fps) {
    stopAll();
    mode = 'mirror';
    markActive();
    video.muted = true; // mirror audio is Web Audio, not the <video> track
    mirrorFps = Math.max(1, Number(fps) || 60);
    if (typeof MediaSource === 'undefined') {
      emit({ event: 'error', message: 'MediaSource unsupported' });
      return;
    }
    ensureAudioGraph(audioSampleRate, audioChannels);
    createJmuxer(mirrorFps);
    connectAudio(audioWsUrl);
    mirrorWs = new WebSocket(wsUrl);
    mirrorWs.binaryType = 'arraybuffer';
    mirrorWs.onopen = function () { log('mirror ws open'); };
    mirrorWs.onclose = function () { log('mirror ws closed'); };
    mirrorWs.onerror = function () { emit({ event: 'error', message: 'mirror websocket error' }); };
    mirrorWs.onmessage = function (ev) {
      feedMirror(new Uint8Array(ev.data));
    };
  }

  function startHls(url, epoch) {
    stopAll();
    hlsEpoch = epoch != null ? Number(epoch) : (hlsEpoch + 1);
    mode = 'hls';
    markActive();
    video.muted = false;
    if (!window.Hls || !Hls.isSupported()) {
      emit({ event: 'error', message: 'Hls.js / MSE not supported' });
      return;
    }
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      backBufferLength: 30,
      // YouTube VOD scrub: jump without waiting forever for a perfect contiguous buffer.
      maxBufferHole: 1.5,
      nudgeMaxRetry: 5
    });
    hls.on(Hls.Events.ERROR, function (_e, data) {
      if (data && data.fatal) {
        emit({ event: 'error', message: 'hls fatal ' + data.type + '/' + data.details });
        try {
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
          else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        } catch (e) {}
      }
    });
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      log('hls manifest parsed epoch=' + hlsEpoch);
      playSafe();
    });
    if (!videoErrorHooked) {
      videoErrorHooked = true;
      video.addEventListener('error', function () {
        if (mode !== 'hls') return;
        emit({ event: 'error', message: 'video element error' });
      });
    }
    hls.loadSource(url);
    hls.attachMedia(video);
    log('hls loadSource epoch=' + hlsEpoch + ' ' + url);
  }

  function onCommand(msg) {
    var cmd = msg.cmd;
    if (cmd === 'startMirror') startMirror(msg.wsUrl, msg.audioWsUrl, msg.fps);
    else if (cmd === 'stopMirror') { stopMirror(); mode = 'idle'; video.classList.add('idle'); }
    else if (cmd === 'configureAudio') {
      ensureAudioGraph(Number(msg.sampleRate) || 44100, Number(msg.channels) || 2);
    } else if (cmd === 'startHls') startHls(msg.url, msg.epoch);
    else if (cmd === 'stopHls') {
      stopHls(msg.epoch);
      if (msg.epoch == null || msg.epoch === hlsEpoch) {
        mode = 'idle';
        video.classList.add('idle');
      }
    } else if (cmd === 'stopAll') stopAll();
    else if (cmd === 'pause') {
      try { video.pause(); } catch (e) {}
      try { if (audioCtx) audioCtx.suspend(); } catch (e) {}
    } else if (cmd === 'resume') {
      playSafe();
      try { if (audioCtx) audioCtx.resume(); } catch (e) {}
    } else if (cmd === 'seek') {
      try {
        if (!isFinite(msg.seconds) || msg.seconds < 0) return;
        if (hls) {
          try { hls.startLoad(msg.seconds); } catch (e) {}
        }
        video.currentTime = msg.seconds;
        // Java sends resume after seek; do not auto-play here (would fight real pause).
      } catch (e) {
        emit({ event: 'error', message: 'seek: ' + e });
        try { if (hls) hls.recoverMediaError(); } catch (e2) {}
      }
    } else if (cmd === 'setVolume') {
      var v = Number(msg.value);
      if (!isFinite(v)) return;
      volumeLinear = Math.max(0, Math.min(1, v));
      video.volume = volumeLinear;
      video.muted = (mode === 'mirror') || volumeLinear === 0;
      if (gainNode) gainNode.gain.value = volumeLinear;
    }
  }

  function connectControl() {
    var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/control';
    controlWs = new WebSocket(url);
    controlWs.onopen = function () {
      log('control ws open');
      emit({ event: 'ready' });
      if (!playbackTimer) {
        playbackTimer = setInterval(reportPlayback, 500);
      }
    };
    controlWs.onclose = function () {
      log('control ws closed; reconnecting');
      setTimeout(connectControl, 500);
    };
    controlWs.onerror = function () { /* reconnect via onclose */ };
    controlWs.onmessage = function (ev) {
      try { onCommand(JSON.parse(ev.data)); }
      catch (e) { emit({ event: 'error', message: 'bad command: ' + e }); }
    };
  }

  connectControl();
  video.classList.add('idle');
})();
</script>
</body>
</html>
