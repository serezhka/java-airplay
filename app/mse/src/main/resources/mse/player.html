<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>airplay-mse</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    #stage {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }
    video.idle { visibility: hidden; }
  </style>
  <script src="jmuxer.min.js"></script>
  <script src="hls.min.js"></script>
  <script src="fdk_aac.js"></script>
  <script src="alac.js"></script>
</head>
<body>
<div id="stage"><video id="player" autoplay playsinline></video></div>
<script>
(function () {
  const video = document.getElementById('player');
  let hls = null;
  let jmuxer = null;
  let mirrorWs = null;
  let audioWs = null;
  let controlWs = null;
  let mode = 'idle';
  let playbackTimer = null;
  let mirrorFps = 60;
  let lastSpsKey = null;
  let hlsEpoch = 0;
  let videoErrorHooked = false;

  // AAC-ELD/LC → fdk-aac WASM; ALAC → alac.js; both → Web Audio.
  let audioCtx = null;
  let gainNode = null;
  let nextAudioTime = 0;
  let audioSampleRate = 44100;
  let audioChannels = 2;
  let pcmBytesQueued = 0;
  let volumeLinear = 1;
  let fdkModule = null;
  let fdkReady = null;
  let fdkOpen = false;
  let fdkOutPtr = 0;
  let fdkOutCap = 0;
  let aacFramesDecoded = 0;
  let alacDecoder = null;
  let alacFramesDecoded = 0;
  let audioCodec = 'none'; // aac | alac | none

  // Test hooks (Playwright).
  window.__mse = {
    mode: function () { return mode; },
    pcmBytesQueued: function () { return pcmBytesQueued; },
    aacFramesDecoded: function () { return aacFramesDecoded; },
    alacFramesDecoded: function () { return alacFramesDecoded; },
    fdkOpen: function () { return fdkOpen; },
    alacOpen: function () { return !!alacDecoder; },
    hasJmuxer: function () { return !!jmuxer; },
    hasHls: function () { return !!hls; },
    videoReadyState: function () { return video.readyState; }
  };

  function emit(obj) {
    if (controlWs && controlWs.readyState === 1) {
      controlWs.send(JSON.stringify(obj));
    }
  }

  function log(msg) {
    emit({ event: 'log', message: String(msg) });
    console.log('[airplay-mse]', msg);
  }

  function isAbortError(err) {
    return err && (err.name === 'AbortError' || String(err).indexOf('AbortError') >= 0);
  }

  function playSafe() {
    var p = video.play();
    if (p && p.catch) {
      p.catch(function (e) {
        if (isAbortError(e)) {
          log('play aborted (ignored)');
          return;
        }
        emit({ event: 'error', message: 'play: ' + e });
      });
    }
  }

  function hexToBytes(hex) {
    if (!hex) return new Uint8Array(0);
    var clean = String(hex).replace(/[^0-9a-fA-F]/g, '');
    var n = (clean.length / 2) | 0;
    var out = new Uint8Array(n);
    for (var i = 0; i < n; i++) {
      out[i] = parseInt(clean.substr(i * 2, 2), 16);
    }
    return out;
  }

  function ensureFdk() {
    if (fdkModule) return Promise.resolve(fdkModule);
    if (fdkReady) return fdkReady;
    if (typeof createFdkAacModule !== 'function') {
      return Promise.reject(new Error('fdk_aac.js not loaded'));
    }
    fdkReady = createFdkAacModule({
      locateFile: function (path) { return path; }
    }).then(function (mod) {
      fdkModule = mod;
      log('fdk-aac wasm ready');
      return mod;
    }).catch(function (e) {
      fdkReady = null;
      emit({ event: 'error', message: 'fdk init: ' + e });
      throw e;
    });
    return fdkReady;
  }

  function ensureAudioGraph(sampleRate, channels) {
    audioSampleRate = sampleRate || 44100;
    audioChannels = channels || 2;
    if (!audioCtx || audioCtx.sampleRate !== audioSampleRate) {
      try { if (audioCtx) audioCtx.close(); } catch (e) {}
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: audioSampleRate });
      gainNode = audioCtx.createGain();
      gainNode.gain.value = volumeLinear;
      gainNode.connect(audioCtx.destination);
      nextAudioTime = 0;
      log('audio context ' + audioSampleRate + 'Hz x' + audioChannels);
    } else if (gainNode) {
      gainNode.gain.value = volumeLinear;
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
  }

  function closeFdk() {
    if (fdkModule && fdkOpen) {
      try { fdkModule._fdk_close(); } catch (e) {}
    }
    fdkOpen = false;
    if (fdkModule && fdkOutPtr) {
      try { fdkModule._free(fdkOutPtr); } catch (e) {}
    }
    fdkOutPtr = 0;
    fdkOutCap = 0;
  }

  function closeAlac() {
    alacDecoder = null;
  }

  function stopAacAudio() {
    if (audioWs) {
      try { audioWs.close(); } catch (e) {}
      audioWs = null;
    }
    closeFdk();
    closeAlac();
    audioCodec = 'none';
    nextAudioTime = 0;
    try { if (audioCtx) audioCtx.suspend(); } catch (e) {}
  }

  function scheduleFloatPlanes(planes, numSamples) {
    if (!audioCtx || !gainNode || !planes || !planes.length || numSamples < 1) return;
    var chCount = Math.min(audioChannels, planes.length);
    var buffer = audioCtx.createBuffer(chCount, numSamples, audioSampleRate);
    for (var ch = 0; ch < chCount; ch++) {
      buffer.copyToChannel(planes[ch].subarray(0, numSamples), ch);
    }
    var src = audioCtx.createBufferSource();
    src.buffer = buffer;
    src.connect(gainNode);
    var now = audioCtx.currentTime;
    if (nextAudioTime < now + 0.02) {
      nextAudioTime = now + 0.02;
    }
    src.start(nextAudioTime);
    nextAudioTime += buffer.duration;
    pcmBytesQueued += numSamples * chCount * 2;
    if (nextAudioTime > now + 0.75) {
      nextAudioTime = now + 0.25;
    }
  }

  function schedulePcmS16(s16) {
    if (!audioCtx || !gainNode || !s16 || s16.length < audioChannels) return;
    var frames = (s16.length / audioChannels) | 0;
    if (frames < 1) return;
    var planes = [];
    for (var ch = 0; ch < audioChannels; ch++) {
      var plane = new Float32Array(frames);
      for (var i = 0; i < frames; i++) {
        plane[i] = s16[i * audioChannels + ch] / 32768;
      }
      planes.push(plane);
    }
    scheduleFloatPlanes(planes, frames);
  }

  function decodeAacAu(arrayBuffer) {
    if (!fdkModule || !fdkOpen || !arrayBuffer || arrayBuffer.byteLength < 1) return;
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
    var inBytes = new Uint8Array(arrayBuffer);
    var inPtr = fdkModule._malloc(inBytes.length);
    if (!inPtr) return;
    fdkModule.HEAPU8.set(inBytes, inPtr);
    var need = fdkModule._fdk_frame_samples() * fdkModule._fdk_channels();
    if (need * 2 > fdkOutCap) {
      if (fdkOutPtr) fdkModule._free(fdkOutPtr);
      fdkOutCap = Math.max(need * 2, 8192);
      fdkOutPtr = fdkModule._malloc(fdkOutCap);
    }
    var nbytes = fdkModule._fdk_decode(inPtr, inBytes.length, fdkOutPtr, fdkOutCap / 2);
    fdkModule._free(inPtr);
    if (nbytes <= 0) {
      if (nbytes !== 0) log('fdk_decode err ' + nbytes);
      return;
    }
    var samples = nbytes / 2;
    var s16 = new Int16Array(fdkModule.HEAP16.buffer, fdkOutPtr, samples);
    // Copy — HEAP views can move after grow.
    schedulePcmS16(new Int16Array(s16));
    aacFramesDecoded++;
  }

  function decodeAlacAu(arrayBuffer) {
    if (!alacDecoder || !arrayBuffer || arrayBuffer.byteLength < 1) return;
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume().catch(function () {});
    }
    try {
      var out = alacDecoder.decodeFrame(new Uint8Array(arrayBuffer));
      if (!out || !out.numSamples) return;
      scheduleFloatPlanes(out.channelData, out.numSamples);
      alacFramesDecoded++;
    } catch (e) {
      log('alac decode: ' + e);
    }
  }

  function decodeAudioAu(arrayBuffer) {
    if (audioCodec === 'alac') decodeAlacAu(arrayBuffer);
    else if (audioCodec === 'aac') decodeAacAu(arrayBuffer);
  }

  function openFdkWithAsc(ascBytes) {
    return ensureFdk().then(function (mod) {
      closeFdk();
      closeAlac();
      var ptr = mod._malloc(ascBytes.length);
      mod.HEAPU8.set(ascBytes, ptr);
      var rc = mod._fdk_open(ptr, ascBytes.length);
      mod._free(ptr);
      if (rc !== 0) {
        emit({ event: 'error', message: 'fdk_open failed rc=' + rc });
        return;
      }
      fdkOpen = true;
      audioCodec = 'aac';
      var ch = mod._fdk_channels() || audioChannels;
      audioChannels = ch > 0 ? ch : audioChannels;
      ensureAudioGraph(audioSampleRate, audioChannels);
      log('fdk open ch=' + audioChannels + ' frame=' + mod._fdk_frame_samples());
    });
  }

  function configureAac(msg) {
    var codec = msg.codec || 'none';
    if (codec === 'none') {
      closeFdk();
      closeAlac();
      audioCodec = 'none';
      return;
    }
    audioSampleRate = Number(msg.sampleRate) || 44100;
    audioChannels = Number(msg.channels) || 2;
    var asc = hexToBytes(msg.ascHex || '');
    if (!asc.length) {
      emit({ event: 'error', message: 'configureAac missing ascHex' });
      return;
    }
    ensureAudioGraph(audioSampleRate, audioChannels);
    openFdkWithAsc(asc).catch(function (e) {
      emit({ event: 'error', message: 'configureAac: ' + e });
    });
  }

  function configureAlac(msg) {
    closeFdk();
    closeAlac();
    audioSampleRate = Number(msg.sampleRate) || 44100;
    audioChannels = Number(msg.channels) || 2;
    var cookie = hexToBytes(msg.cookieHex || '');
    if (!cookie.length || typeof createALAC !== 'function') {
      emit({ event: 'error', message: 'configureAlac missing cookie or alac.js' });
      return;
    }
    try {
      alacDecoder = createALAC(cookie);
      if (alacDecoder.config) {
        if (alacDecoder.config.sampleRate) audioSampleRate = alacDecoder.config.sampleRate;
        if (alacDecoder.config.numChannels) audioChannels = alacDecoder.config.numChannels;
      }
      audioCodec = 'alac';
      ensureAudioGraph(audioSampleRate, audioChannels);
      log('alac open ' + audioSampleRate + 'Hz x' + audioChannels);
    } catch (e) {
      emit({ event: 'error', message: 'configureAlac: ' + e });
    }
  }

  function connectAudio(wsUrl) {
    if (audioWs) {
      try { audioWs.close(); } catch (e) {}
      audioWs = null;
    }
    if (!wsUrl) return;
    audioWs = new WebSocket(wsUrl);
    audioWs.binaryType = 'arraybuffer';
    audioWs.onopen = function () { log('audio ws open'); };
    audioWs.onclose = function () { log('audio ws closed'); };
    audioWs.onerror = function () { emit({ event: 'error', message: 'audio websocket error' }); };
    audioWs.onmessage = function (ev) {
      if (ev.data instanceof ArrayBuffer) decodeAudioAu(ev.data);
    };
  }

  function stopHls(epoch) {
    if (epoch != null && epoch !== hlsEpoch) {
      log('stopHls ignored stale epoch ' + epoch + ' (current ' + hlsEpoch + ')');
      return;
    }
    if (hls) {
      try { hls.detachMedia(); } catch (e) {}
      try { hls.destroy(); } catch (e) {}
      hls = null;
    }
    try {
      video.pause();
      video.removeAttribute('src');
      video.srcObject = null;
      video.load();
    } catch (e) {}
  }

  function destroyJmuxer() {
    if (jmuxer) {
      try { jmuxer.destroy(); } catch (e) {}
      jmuxer = null;
    }
    lastSpsKey = null;
  }

  function stopMirror() {
    if (mirrorWs) {
      try { mirrorWs.close(); } catch (e) {}
      mirrorWs = null;
    }
    destroyJmuxer();
    stopAacAudio();
  }

  function stopAll() {
    stopHls(hlsEpoch);
    stopMirror();
    mode = 'idle';
    video.classList.add('idle');
  }

  function markActive() {
    video.classList.remove('idle');
  }

  function reportPlayback() {
    // Duration/position hints only — Java owns rate for /playback-info.
    var duration = isFinite(video.duration) ? video.duration : 0;
    var position = video.currentTime || 0;
    if (mode === 'hls' && video.ended && duration > 0) {
      position = duration;
    }
    emit({ event: 'playback', duration: duration, position: position, rate: 0, mode: mode });
  }

  video.addEventListener('ended', function () {
    if (mode === 'hls') {
      log('video ended');
      var duration = isFinite(video.duration) ? video.duration : 0;
      emit({ event: 'playback', duration: duration, position: duration, rate: 1, mode: 'hls' });
      emit({ event: 'ended' });
    }
  });

  function spsKeyFromAnnexB(bytes) {
    var i = 0;
    var key = null;
    while (i + 4 < bytes.length) {
      var sc = 0;
      if (bytes[i] === 0 && bytes[i + 1] === 0 && bytes[i + 2] === 0 && bytes[i + 3] === 1) sc = 4;
      else if (bytes[i] === 0 && bytes[i + 1] === 0 && bytes[i + 2] === 1) sc = 3;
      else { i++; continue; }
      var start = i + sc;
      var j = start;
      while (j + 3 < bytes.length) {
        if (bytes[j] === 0 && bytes[j + 1] === 0 && (bytes[j + 2] === 1 || (bytes[j + 2] === 0 && bytes[j + 3] === 1))) break;
        j++;
      }
      if (start < bytes.length) {
        var nalType = bytes[start] & 0x1f;
        if (nalType === 7) {
          key = bytes.subarray(start, j).join(',');
        }
      }
      i = j > start ? j : start + 1;
    }
    return key;
  }

  function createJmuxer(fps) {
    destroyJmuxer();
    try {
      video.pause();
      video.removeAttribute('src');
      video.srcObject = null;
      video.load();
    } catch (e) {}
    jmuxer = new JMuxer({
      node: 'player',
      mode: 'video',
      flushingTime: 0,
      fps: Math.max(1, Number(fps) || 60),
      debug: false
    });
  }

  function feedMirror(bytes) {
    if (!jmuxer) return;
    var spsKey = spsKeyFromAnnexB(bytes);
    if (spsKey && lastSpsKey && spsKey !== lastSpsKey) {
      log('SPS changed (rotate/resolution); recreating jmuxer');
      createJmuxer(mirrorFps);
    }
    if (spsKey) lastSpsKey = spsKey;
    try {
      jmuxer.feed({ video: bytes });
    } catch (e) {
      emit({ event: 'error', message: 'jmuxer feed: ' + e });
      try {
        createJmuxer(mirrorFps);
        if (spsKey) lastSpsKey = spsKey;
        jmuxer.feed({ video: bytes });
        log('jmuxer recovered after feed error');
      } catch (e2) {
        emit({ event: 'error', message: 'jmuxer recover failed: ' + e2 });
      }
    }
  }

  function startMirror(wsUrl, audioWsUrl, fps) {
    stopAll();
    mode = 'mirror';
    markActive();
    video.muted = true; // mirror audio is Web Audio, not the <video> track
    mirrorFps = Math.max(1, Number(fps) || 60);
    if (typeof MediaSource === 'undefined') {
      emit({ event: 'error', message: 'MediaSource unsupported' });
      return;
    }
    ensureFdk().catch(function () {});
    ensureAudioGraph(audioSampleRate, audioChannels);
    createJmuxer(mirrorFps);
    connectAudio(audioWsUrl);
    mirrorWs = new WebSocket(wsUrl);
    mirrorWs.binaryType = 'arraybuffer';
    mirrorWs.onopen = function () { log('mirror ws open'); };
    mirrorWs.onclose = function () { log('mirror ws closed'); };
    mirrorWs.onerror = function () { emit({ event: 'error', message: 'mirror websocket error' }); };
    mirrorWs.onmessage = function (ev) {
      feedMirror(new Uint8Array(ev.data));
    };
  }

  function startHls(url, epoch) {
    stopAll();
    hlsEpoch = epoch != null ? Number(epoch) : (hlsEpoch + 1);
    mode = 'hls';
    markActive();
    video.muted = false;
    if (!window.Hls || !Hls.isSupported()) {
      emit({ event: 'error', message: 'Hls.js / MSE not supported' });
      return;
    }
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      backBufferLength: 30,
      // YouTube VOD scrub: jump without waiting forever for a perfect contiguous buffer.
      maxBufferHole: 1.5,
      nudgeMaxRetry: 5
    });
    hls.on(Hls.Events.ERROR, function (_e, data) {
      if (data && data.fatal) {
        emit({ event: 'error', message: 'hls fatal ' + data.type + '/' + data.details });
        try {
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) hls.startLoad();
          else if (data.type === Hls.ErrorTypes.MEDIA_ERROR) hls.recoverMediaError();
        } catch (e) {}
      }
    });
    hls.on(Hls.Events.MANIFEST_PARSED, function () {
      log('hls manifest parsed epoch=' + hlsEpoch);
      playSafe();
    });
    if (!videoErrorHooked) {
      videoErrorHooked = true;
      video.addEventListener('error', function () {
        if (mode !== 'hls') return;
        emit({ event: 'error', message: 'video element error' });
      });
    }
    hls.loadSource(url);
    hls.attachMedia(video);
    log('hls loadSource epoch=' + hlsEpoch + ' ' + url);
  }

  function onCommand(msg) {
    var cmd = msg.cmd;
    if (cmd === 'startMirror') startMirror(msg.wsUrl, msg.audioWsUrl, msg.fps);
    else if (cmd === 'stopMirror') { stopMirror(); mode = 'idle'; video.classList.add('idle'); }
    else if (cmd === 'configureAac') configureAac(msg);
    else if (cmd === 'configureAlac') configureAlac(msg);
    else if (cmd === 'configureAudio') {
      // Legacy no-op (PCM path removed); keep for older test pages.
      ensureAudioGraph(Number(msg.sampleRate) || 44100, Number(msg.channels) || 2);
    } else if (cmd === 'startHls') startHls(msg.url, msg.epoch);
    else if (cmd === 'stopHls') {
      stopHls(msg.epoch);
      if (msg.epoch == null || msg.epoch === hlsEpoch) {
        mode = 'idle';
        video.classList.add('idle');
      }
    } else if (cmd === 'stopAll') stopAll();
    else if (cmd === 'pause') {
      try { video.pause(); } catch (e) {}
      try { if (audioCtx) audioCtx.suspend(); } catch (e) {}
    } else if (cmd === 'resume') {
      playSafe();
      try { if (audioCtx) audioCtx.resume(); } catch (e) {}
    } else if (cmd === 'seek') {
      try {
        if (!isFinite(msg.seconds) || msg.seconds < 0) return;
        if (hls) {
          try { hls.startLoad(msg.seconds); } catch (e) {}
        }
        video.currentTime = msg.seconds;
        // Java sends resume after seek; do not auto-play here (would fight real pause).
      } catch (e) {
        emit({ event: 'error', message: 'seek: ' + e });
        try { if (hls) hls.recoverMediaError(); } catch (e2) {}
      }
    } else if (cmd === 'setVolume') {
      var v = Number(msg.value);
      if (!isFinite(v)) return;
      volumeLinear = Math.max(0, Math.min(1, v));
      video.volume = volumeLinear;
      video.muted = (mode === 'mirror') || volumeLinear === 0;
      if (gainNode) gainNode.gain.value = volumeLinear;
    }
  }

  function connectControl() {
    var url = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/control';
    controlWs = new WebSocket(url);
    controlWs.onopen = function () {
      log('control ws open');
      emit({ event: 'ready' });
      if (!playbackTimer) {
        playbackTimer = setInterval(reportPlayback, 500);
      }
    };
    controlWs.onclose = function () {
      log('control ws closed; reconnecting');
      setTimeout(connectControl, 500);
    };
    controlWs.onerror = function () { /* reconnect via onclose */ };
    controlWs.onmessage = function (ev) {
      try { onCommand(JSON.parse(ev.data)); }
      catch (e) { emit({ event: 'error', message: 'bad command: ' + e }); }
    };
  }

  ensureFdk().catch(function () {});
  connectControl();
  video.classList.add('idle');
})();
</script>
</body>
</html>
