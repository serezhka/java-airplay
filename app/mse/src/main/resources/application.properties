# log — INFO by default (override to DEBUG locally if needed)
logging.file.name=logs/server.log
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.javax.jmdns=WARN
logging.level.com.github.serezhka=INFO
logging.level.io.netty=WARN
logging.level.io.netty.handler.logging.LoggingHandler=WARN
spring.output.ansi.enabled=ALWAYS

# --- Receiver (mDNS / capabilities / Playback) ---
airplay.server-name=JavaAirPlay-MSE
airplay.width=1920
airplay.height=1080
airplay.fps=60
airplay.hls-enabled=true
airplay.mdns-loopback=false
airplay.tray-enabled=true

# --- Cast sender (tray → remote AirPlay) ---
# Default off for the MSE jar (receive-only). Set both to browser to enable tray cast:
#   client.video.src=browser  — navigable Chromium tab capture (not the desktop)
#   client.audio.src=browser  — tab audio to HAP TVs (-Dairplay.mse.cast.enableAudio)
# With both none the Cast tray item is grayed out and outbound discovery is skipped.
client.video.src=none
client.audio.src=none

# --- Receive-side session dump ---
dump.enabled=false
dump.directory=dumps
