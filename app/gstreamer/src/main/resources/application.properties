# log — INFO by default (override to DEBUG on a lab host if needed)
logging.file.name=logs/server.log
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.javax.jmdns=WARN
logging.level.com.github.serezhka=INFO
logging.level.io.netty=WARN
logging.level.io.netty.handler.logging.LoggingHandler=WARN
logging.level.org.freedesktop.gstreamer=WARN
spring.output.ansi.enabled=ALWAYS

# --- Receiver (mDNS / capabilities / Playback) ---
airplay.server-name=JavaAirPlay
airplay.width=1920
airplay.height=1080
airplay.fps=60
airplay.hls-enabled=true
airplay.mdns-loopback=false
airplay.tray-enabled=true

# --- Cast sender (tray → remote AirPlay) ---
# videotest | screencapture | none
client.video.src=videotest
# audiotest | none
client.audio.src=audiotest

# --- Receive-side session dump ---
dump.enabled=false
dump.directory=dumps
dump.protocol=true
dump.video=true
dump.audio=true
dump.playlist=true
dump.artwork=true
dump.videoFps=60
