name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      bench:
        description: Run 5-minute benches
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']

concurrency:
  # PR runs use refs/pull/N/merge; keep them from cancelling main pushes.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew test :app:common:loopbackIntegrationTest --no-daemon

  # OS × player: production Playback path (mirror, A/V, reconnect, HLS round-trip).
  playback:
    needs: unit
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        player: [ffmpeg, gstreamer]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - uses: ./.github/actions/setup-native-player
        with:
          player: ${{ matrix.player }}
      - name: Integration test
        timeout-minutes: 15
        shell: bash
        run: |
          TASK=":app:${{ matrix.player }}:${{ matrix.player }}IntegrationTest"
          EXTRA=()
          if [ -n "${GSTREAMER_BIN:-}" ]; then EXTRA+=("-Dgstreamer.path=$GSTREAMER_BIN"); fi
          # Windows runners have no usable display for d3d11videosink; Linux uses xvfb + ximagesink.
          if [ "${{ matrix.player }}" = "gstreamer" ] && [ "${{ runner.os }}" = "Windows" ]; then
            EXTRA+=("-Dairplay.gst.appsink=true" "-Dairplay.gst.hls.headless=true")
          fi
          if [ "${{ matrix.player }}" = "gstreamer" ] && [ "${{ runner.os }}" = "Linux" ]; then
            EXTRA+=("-Dairplay.gst.hls.headless=true")
          fi
          if [ "${{ matrix.player }}" = "ffmpeg" ]; then
            EXTRA+=("-Dairplay.ffmpeg.hls.headless=true")
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a ./gradlew "$TASK" --no-daemon "${EXTRA[@]}"
          else
            ./gradlew "$TASK" --no-daemon "${EXTRA[@]}"
          fi

  # Benchmarks: Linux only, one player per runner (matrix). Never parallelize players on one machine.
  bench:
    if: github.event_name == 'workflow_dispatch' && inputs.bench == 'true'
    needs: unit
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        player: [ffmpeg, gstreamer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - uses: ./.github/actions/setup-native-player
        with:
          player: ${{ matrix.player }}
      - name: 5-minute bench
        timeout-minutes: 10
        run: |
          EXTRA=(-Dairplay.harness.metrics=true -Dairplay.harness.bench.seconds=300)
          if [ "${{ matrix.player }}" = "gstreamer" ]; then
            EXTRA+=("-Dairplay.gst.hls.headless=true")
          else
            EXTRA+=("-Dairplay.ffmpeg.hls.headless=true")
          fi
          xvfb-run -a ./gradlew :app:${{ matrix.player }}:benchIntegrationTest --no-daemon "${EXTRA[@]}"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-${{ runner.os }}-${{ matrix.player }}
          path: app/${{ matrix.player }}/build/reports/playback-metrics/**
          if-no-files-found: ignore

  pages:
    needs: [playback, bench]
    if: always() && !cancelled() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: pages-src
          pattern: 'bench-*'
          merge-multiple: false
      - name: Build site
        env:
          PAGES_SRC: pages-src
          PAGES_OUT: pages-out
        run: |
          mkdir -p pages-src pages-out
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.json" \
            -o pages-out/history.json || echo '[]' > pages-out/history.json
          python3 .github/scripts/build-pages-report.py
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: pages-out
          keep_files: true
          force_orphan: false
