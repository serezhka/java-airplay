name: ci

on:
  push:
    branches: [main, cursor/cicd-tests]
  workflow_dispatch:
    inputs:
      bench:
        description: Run 5-minute benches
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test :player:harness:loopbackIntegrationTest --no-daemon

  playback:
    needs: unit
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        player: [ffmpeg, gstreamer, vlc]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup-native-player
        with:
          player: ${{ matrix.player }}
      - name: Integration test
        timeout-minutes: 10
        env:
          AIRPLAY_VLC_HEADLESS: 'true'
          AIRPLAY_GST_CLI: 'true'
        shell: bash
        run: |
          TASK="${{ matrix.player }}IntegrationTest"
          EXTRA=(-Dairplay.harness.metrics=true -Dairplay.vlc.headless=true -Dairplay.gst.cli=true)
          if [ -n "${GSTREAMER_BIN:-}" ]; then EXTRA+=("-Dgstreamer.path=$GSTREAMER_BIN"); fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a ./gradlew ":player:harness:$TASK" --no-daemon "${EXTRA[@]}"
          else
            ./gradlew ":player:harness:$TASK" --no-daemon "${EXTRA[@]}"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-${{ matrix.os }}-${{ matrix.player }}
          path: |
            **/build/reports/playback-metrics/**
            **/build/test-results/**
          if-no-files-found: ignore

  bench:
    if: github.ref == 'refs/heads/cursor/cicd-tests' || (github.event_name == 'workflow_dispatch' && inputs.bench == 'true')
    needs: unit
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        player: [ffmpeg, gstreamer, vlc]
    runs-on: ubuntu-latest
    env:
      AIRPLAY_VLC_HEADLESS: 'true'
      AIRPLAY_GST_CLI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - uses: ./.github/actions/setup-native-player
        with:
          player: ${{ matrix.player }}
      - name: 5-minute bench
        timeout-minutes: 10
        run: |
          xvfb-run -a ./gradlew :player:harness:benchIntegrationTest --no-daemon \
            -Dairplay.harness.metrics=true \
            -Dairplay.harness.bench.seconds=300 \
            -Dairplay.harness.bench.player=${{ matrix.player }} \
            -Dairplay.vlc.headless=true \
            -Dairplay.gst.cli=true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.player }}
          path: player/harness/build/reports/playback-metrics/**
          if-no-files-found: ignore

  pages:
    needs: [playback, bench]
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/cursor/cicd-tests')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: pages-src
          pattern: '{playback-*,bench-*}'
          merge-multiple: false
      - name: Build site
        env:
          PAGES_SRC: pages-src
          PAGES_OUT: pages-out
        run: |
          mkdir -p pages-src pages-out
          curl -fsSL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history.json" \
            -o pages-out/history.json || echo '[]' > pages-out/history.json
          python3 .github/scripts/build-pages-report.py
          # Always publish something browseable even if no metrics yet.
          test -f pages-out/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-out
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4
