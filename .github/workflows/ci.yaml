name: ci

on:
  push:
    branches: [main, cursor/cicd-tests]
  workflow_dispatch:
    inputs:
      bench:
        description: Run 5-minute benchIntegrationTest matrix
        required: false
        default: 'true'
        type: choice
        options: ['false', 'true']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Loopback control
        run: ./gradlew :player:harness:loopbackIntegrationTest --no-daemon

  playback:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            player: ffmpeg
          - os: ubuntu-latest
            player: gstreamer
          - os: ubuntu-latest
            player: vlc
          - os: windows-latest
            player: ffmpeg
          - os: windows-latest
            player: gstreamer
          - os: windows-latest
            player: vlc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup native player
        uses: ./.github/actions/setup-native-player
        with:
          player: ${{ matrix.player }}

      - name: Playback integration test (Linux)
        if: runner.os == 'Linux'
        run: |
          case "${{ matrix.player }}" in
            gstreamer) TASK=gstreamerIntegrationTest ;;
            vlc) TASK=vlcIntegrationTest ;;
            *) TASK=ffmpegIntegrationTest ;;
          esac
          xvfb-run -a ./gradlew :player:harness:$TASK --no-daemon -Dairplay.harness.metrics=true

      - name: Playback integration test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $task = switch ('${{ matrix.player }}') {
            'gstreamer' { 'gstreamerIntegrationTest' }
            'vlc' { 'vlcIntegrationTest' }
            default { 'ffmpegIntegrationTest' }
          }
          $extra = @('-Dairplay.harness.metrics=true')
          if ($env:GSTREAMER_BIN) {
            $extra += "-Dgstreamer.path=$($env:GSTREAMER_BIN)"
          } elseif ($env:GSTREAMER_1_0_ROOT_MSVC_X86_64) {
            $gstBin = Join-Path $env:GSTREAMER_1_0_ROOT_MSVC_X86_64 'bin'
            $extra += "-Dgstreamer.path=$gstBin"
          }
          ./gradlew ":player:harness:$task" --no-daemon @extra

      - name: Upload playback reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playback-${{ matrix.os }}-${{ matrix.player }}
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore

  bench:
    # 5-minute benches: on this feature branch always, elsewhere via workflow_dispatch.
    if: >
      github.ref == 'refs/heads/cursor/cicd-tests' ||
      (github.event_name == 'workflow_dispatch' && inputs.bench == 'true')
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        player: [ffmpeg, gstreamer, vlc]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Setup native player
        uses: ./.github/actions/setup-native-player
        with:
          player: ${{ matrix.player }}
      - name: 5-minute bench
        run: |
          xvfb-run -a ./gradlew :player:harness:benchIntegrationTest --no-daemon \
            -Dairplay.harness.metrics=true \
            -Dairplay.harness.bench.seconds=300 \
            -Dairplay.harness.bench.player=${{ matrix.player }} \
            -Dairplay.gst.appsink=${{ matrix.player == 'gstreamer' }}
      - name: Publish report summary
        if: always()
        run: |
          REPORT_DIR=player/harness/build/reports/playback-metrics
          if [ -d "$REPORT_DIR" ]; then
            echo "## Bench ${{ matrix.player }}" >> "$GITHUB_STEP_SUMMARY"
            for f in "$REPORT_DIR"/*.json; do
              [ -f "$f" ] || continue
              echo "### $(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
              python3 - <<'PY' "$f" >> "$GITHUB_STEP_SUMMARY"
          import json,sys
          d=json.load(open(sys.argv[1]))
          lat=d.get("writeLatencyMs",{})
          print(f"- wall: {d.get('wallMillis',0)/1000:.1f}s")
          print(f"- framesOk/fail: {d.get('framesOk')}/{d.get('framesFail')}")
          print(f"- latency p50/p95/p99/max ms: {lat.get('p50')}/{lat.get('p95')}/{lat.get('p99')}/{lat.get('max')}")
          print(f"- slowWrites/stalls: {d.get('slowWrites')}/{d.get('stalls')}")
          print(f"- rssHighWater MB: {(d.get('rssHighWaterBytes') or 0)/1024/1024:.1f}")
          PY
            done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-report-${{ matrix.player }}
          path: |
            player/harness/build/reports/playback-metrics/**
            **/build/test-results/benchIntegrationTest/**
          if-no-files-found: ignore
