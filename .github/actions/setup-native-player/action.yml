name: Setup native player

description: Install ffmpeg or gstreamer for harness tests

inputs:
  player:
    description: ffmpeg or gstreamer
    required: true

runs:
  using: composite
  steps:
    - name: Linux packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        # GitHub ubuntu runners sometimes ship a packages.microsoft.com apt source that
        # 403s and fails the whole job before ffmpeg/gstreamer install. Drop it; we only
        # need Ubuntu archive packages for CI natives.
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                   /etc/apt/sources.list.d/microsoft*.list \
                   /etc/apt/sources.list.d/azure-cli.list 2>/dev/null || true
        sudo apt-get update -o Acquire::Retries=3
        case "${{ inputs.player }}" in
          ffmpeg)
            # pulse null sink: ffplay PCM (mirror audio) needs SDL_AUDIODRIVER=pulse
            sudo apt-get install -y ffmpeg xvfb pulseaudio
            pulseaudio --check || pulseaudio --start --exit-idle-time=-1
            pactl load-module module-null-sink sink_name=ci_null 2>/dev/null || true
            pactl set-default-sink ci_null 2>/dev/null || true
            ;;
          gstreamer)
            # libav = avdec_h264 (same soft decode as the app); x11 = ximagesink under xvfb;
            # pulse null sink so autoaudiosink has somewhere to go when not using appsink.
            sudo apt-get install -y \
              gstreamer1.0-tools \
              gstreamer1.0-plugins-base \
              gstreamer1.0-plugins-good \
              gstreamer1.0-plugins-bad \
              gstreamer1.0-libav \
              gstreamer1.0-x \
              gstreamer1.0-pulseaudio \
              pulseaudio \
              xvfb \
              ffmpeg
            pulseaudio --check || pulseaudio --start --exit-idle-time=-1
            pactl load-module module-null-sink sink_name=ci_null 2>/dev/null || true
            pactl set-default-sink ci_null 2>/dev/null || true
            ;;
          *) echo "Unknown player: ${{ inputs.player }}"; exit 1 ;;
        esac

    - name: Windows FFmpeg
      if: runner.os == 'Windows' && inputs.player == 'ffmpeg'
      shell: pwsh
      run: |
        $dest = "$env:RUNNER_TEMP\ffmpeg"
        New-Item -ItemType Directory -Force -Path $dest | Out-Null
        Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
        Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" "$env:RUNNER_TEMP\ffmpeg-extract" -Force
        $inner = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-extract" | Select-Object -First 1
        Copy-Item -Recurse -Force "$($inner.FullName)\*" $dest
        Add-Content $env:GITHUB_PATH "$dest\bin"

    - name: Windows GStreamer
      if: runner.os == 'Windows' && inputs.player == 'gstreamer'
      shell: pwsh
      run: |
        $ver = '1.26.11'
        $msi = "$env:RUNNER_TEMP\gstreamer.msi"
        $prefix = 'C:\gstreamer\1.0\msvc_x86_64'
        Invoke-WebRequest -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc/gstreamer-1.0-msvc-x86_64-$ver.msi" -OutFile $msi
        Start-Process msiexec.exe -Wait -ArgumentList "/a `"$msi`" /qn TARGETDIR=$prefix"
        $exe = Get-ChildItem $prefix -Recurse -Filter gst-launch-1.0.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $exe) { throw "gst-launch-1.0 missing after MSI extract under $prefix" }
        $bin = $exe.Directory.FullName
        $root = (Resolve-Path (Join-Path $bin '..')).Path
        Add-Content $env:GITHUB_PATH $bin
        Add-Content $env:GITHUB_ENV "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root"
        Add-Content $env:GITHUB_ENV "GSTREAMER_BIN=$bin"
        # ffmpeg for HLS fixture generation in GST tests
        $ff = "$env:RUNNER_TEMP\ffmpeg"
        New-Item -ItemType Directory -Force -Path $ff | Out-Null
        Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip' -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
        Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" "$env:RUNNER_TEMP\ffmpeg-extract" -Force
        $inner = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-extract" | Select-Object -First 1
        Copy-Item -Recurse -Force "$($inner.FullName)\*" $ff
        Add-Content $env:GITHUB_PATH "$ff\bin"
