name: Setup native player

description: Install ffmpeg, gstreamer, or Chromium (mse) for harness tests

inputs:
  player:
    description: ffmpeg, gstreamer, or mse
    required: true

runs:
  using: composite
  steps:
    - name: Linux packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        # GitHub ubuntu runners sometimes ship a packages.microsoft.com apt source that
        # 403s and fails the whole job before ffmpeg/gstreamer install. Drop it; we only
        # need Ubuntu archive packages for CI natives.
        sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                   /etc/apt/sources.list.d/microsoft*.list \
                   /etc/apt/sources.list.d/azure-cli.list 2>/dev/null || true
        # GitHub ubuntu images resolve mirrors via file:/etc/apt/apt-mirrors.txt (not
        # sources.list URIs). azure.archive there stalls with Ign/retry on GST deps —
        # rewrite the mirrorlist (and any leftover sources) to archive.ubuntu.com.
        shopt -s nullglob
        for src in /etc/apt/apt-mirrors.txt \
                   /etc/apt/sources.list \
                   /etc/apt/sources.list.d/*.list \
                   /etc/apt/sources.list.d/*.sources; do
          [ -f "$src" ] || continue
          sudo sed -i \
            -e 's|https\?://azure\.archive\.ubuntu\.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            "$src" || true
        done
        # Prefer IPv4 — GHA intermittent AAAA / dual-stack stalls look like apt timeouts.
        APT_OPTS=(
          -o Acquire::Retries=2
          -o Acquire::http::Timeout=15
          -o Acquire::https::Timeout=15
          -o Acquire::ForceIPv4=true
          -o Acquire::Languages=none
        )
        # System resolver sometimes cannot resolve *.ubuntu.com; pin via DoH (no dig pkg).
        pin_host() {
          local host="$1" ip
          if getent hosts "$host" >/dev/null 2>&1; then
            return 0
          fi
          ip="$(curl -fsS --max-time 10 \
            -H 'accept: application/dns-json' \
            "https://cloudflare-dns.com/dns-query?name=${host}&type=A" \
            | python3 -c 'import sys,json; a=json.load(sys.stdin).get("Answer") or []; print(next((x["data"] for x in a if x.get("type")==1), ""), end="")' 2>/dev/null || true)"
          if [ -z "$ip" ]; then
            ip="$(curl -fsS --max-time 10 \
              -H 'accept: application/dns-json' \
              "https://dns.google/resolve?name=${host}&type=A" \
              | python3 -c 'import sys,json; a=json.load(sys.stdin).get("Answer") or []; print(next((x["data"] for x in a if x.get("type")==1), ""), end="")' 2>/dev/null || true)"
          fi
          if [ -n "$ip" ]; then
            echo "Pinning $host -> $ip in /etc/hosts (system DNS failed)" >&2
            echo "$ip $host" | sudo tee -a /etc/hosts >/dev/null
          fi
        }
        set_ubuntu_mirror() {
          local mirror="$1"
          for src in /etc/apt/apt-mirrors.txt \
                     /etc/apt/sources.list \
                     /etc/apt/sources.list.d/*.list \
                     /etc/apt/sources.list.d/*.sources; do
            [ -f "$src" ] || continue
            sudo sed -i -E \
              -e "s|https?://[A-Za-z0-9._-]+/ubuntu|${mirror}|g" \
              "$src" || true
          done
        }
        pin_host archive.ubuntu.com
        pin_host security.ubuntu.com
        pin_host cloudflare.cdn.ubuntu.com
        MIRRORS=(
          "http://archive.ubuntu.com/ubuntu"
          "http://cloudflare.cdn.ubuntu.com/ubuntu"
          "http://mirrors.edge.kernel.org/ubuntu"
        )
        apt_update() {
          local mirror i
          for mirror in "${MIRRORS[@]}"; do
            set_ubuntu_mirror "$mirror"
            host="$(echo "$mirror" | sed -E 's|https?://([^/]+)/.*|\1|')"
            pin_host "$host" || true
            for i in 1 2; do
              if sudo apt-get update "${APT_OPTS[@]}"; then
                echo "apt update ok via $mirror" >&2
                return 0
              fi
              echo "WARN: apt-get update failed via $mirror (attempt $i)" >&2
              sleep 3
            done
          done
          return 1
        }
        apt_install() {
          local i
          for i in 1 2 3; do
            if sudo apt-get install -y --no-install-recommends "${APT_OPTS[@]}" "$@"; then
              return 0
            fi
            echo "WARN: apt-get install failed (attempt $i); rotating mirror..." >&2
            apt_update || true
            sleep 3
          done
          return 1
        }
        apt_update
        # Fail loudly if we are still on azure — otherwise GST setup can crawl to timeout.
        if apt-get indextargets 2>/dev/null | grep -q 'azure.archive.ubuntu.com'; then
          echo "WARN: apt still references azure.archive after rewrite; dumping mirrors:" >&2
          cat /etc/apt/apt-mirrors.txt >&2 || true
        fi
        case "${{ inputs.player }}" in
          ffmpeg)
            # pulse null sink: ffplay PCM (mirror audio) needs SDL_AUDIODRIVER=pulse
            apt_install ffmpeg xvfb pulseaudio
            pulseaudio --check || pulseaudio --start --exit-idle-time=-1
            pactl load-module module-null-sink sink_name=ci_null 2>/dev/null || true
            pactl set-default-sink ci_null 2>/dev/null || true
            ;;
          gstreamer)
            # libav = avdec_h264 (same soft decode as the app); x11 = ximagesink under xvfb;
            # pulse null sink so autoaudiosink has somewhere to go when not using appsink.
            # plugins-bad: hlsdemux2 for playbin3 HLS.
            apt_install \
              gstreamer1.0-tools \
              gstreamer1.0-plugins-base \
              gstreamer1.0-plugins-good \
              gstreamer1.0-plugins-bad \
              gstreamer1.0-libav \
              gstreamer1.0-x \
              gstreamer1.0-pulseaudio \
              pulseaudio \
              xvfb \
              ffmpeg
            pulseaudio --check || pulseaudio --start --exit-idle-time=-1
            pactl load-module module-null-sink sink_name=ci_null 2>/dev/null || true
            pactl set-default-sink ci_null 2>/dev/null || true
            ;;
          mse)
            # Chromium for ChromiumHost + ffmpeg for HLS fixtures; Playwright unit tests
            # download their own browser. Prefer google-chrome-stable when present.
            apt_install xvfb ffmpeg
            if ! command -v google-chrome-stable >/dev/null 2>&1 \
               && ! command -v chromium-browser >/dev/null 2>&1 \
               && ! command -v chromium >/dev/null 2>&1; then
              # Deb from Google — snap chromium is flaky on GHA.
              curl -fsSL https://dl.google.com/linux/linux_signing_key.pub \
                | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
              echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" \
                | sudo tee /etc/apt/sources.list.d/google-chrome.list >/dev/null
              apt_update
              apt_install google-chrome-stable
            fi
            BROWSER="$(command -v google-chrome-stable || command -v chromium-browser || command -v chromium || true)"
            if [ -z "$BROWSER" ]; then
              echo "No Chromium/Chrome after mse setup" >&2
              exit 1
            fi
            echo "AIRPLAY_MSE_BROWSER=$BROWSER" >> "$GITHUB_ENV"
            echo "MSE browser: $BROWSER"
            ;;
          *) echo "Unknown player: ${{ inputs.player }}"; exit 1 ;;
        esac

    - name: Windows FFmpeg
      if: runner.os == 'Windows' && inputs.player == 'ffmpeg'
      shell: pwsh
      run: |
        # Floating "latest" zip — leave uncached (no pin). Retry transient CDN blips.
        $dest = "$env:RUNNER_TEMP\ffmpeg"
        $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
        $uri = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
        New-Item -ItemType Directory -Force -Path $dest | Out-Null
        $ok = $false
        foreach ($i in 1..3) {
          try {
            Invoke-WebRequest -Uri $uri -OutFile $zip
            $ok = $true
            break
          } catch {
            Write-Warning "FFmpeg download attempt $i failed: $_"
            Start-Sleep -Seconds (3 * $i)
          }
        }
        if (-not $ok) { throw "Failed to download FFmpeg after retries" }
        Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg-extract" -Force
        $inner = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-extract" | Select-Object -First 1
        Copy-Item -Recurse -Force "$($inner.FullName)\*" $dest
        Add-Content $env:GITHUB_PATH "$dest\bin"

    # Same Chrome the product expects on Windows (stable channel), plus ffmpeg for HLS fixtures.
    - name: Windows Chrome (MSE)
      if: runner.os == 'Windows' && inputs.player == 'mse'
      id: chrome
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: stable

    - name: Windows MSE FFmpeg + browser env
      if: runner.os == 'Windows' && inputs.player == 'mse'
      shell: pwsh
      run: |
        $chrome = '${{ steps.chrome.outputs.chrome-path }}'
        if (-not $chrome -or -not (Test-Path $chrome)) {
          throw "Chrome missing after setup-chrome: '$chrome'"
        }
        Add-Content $env:GITHUB_ENV "AIRPLAY_MSE_BROWSER=$chrome"
        Write-Host "MSE browser: $chrome"
        $ff = "$env:RUNNER_TEMP\ffmpeg"
        $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
        $uri = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
        New-Item -ItemType Directory -Force -Path $ff | Out-Null
        $ok = $false
        foreach ($i in 1..3) {
          try {
            Invoke-WebRequest -Uri $uri -OutFile $zip
            $ok = $true
            break
          } catch {
            Write-Warning "FFmpeg download attempt $i failed: $_"
            Start-Sleep -Seconds (3 * $i)
          }
        }
        if (-not $ok) { throw "Failed to download FFmpeg after retries" }
        Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg-extract" -Force
        $inner = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-extract" | Select-Object -First 1
        Copy-Item -Recurse -Force "$($inner.FullName)\*" $ff
        Add-Content $env:GITHUB_PATH "$ff\bin"

    # MSI URL is already versioned; cache that one file. apt and FFmpeg "latest" stay uncached.
    - name: Cache Windows GStreamer MSI
      if: runner.os == 'Windows' && inputs.player == 'gstreamer'
      id: gst-msi-cache
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/gstreamer.msi
        # Keep in sync with $ver in the install step below.
        key: gstreamer-msi-1.26.11-msvc_x86_64

    - name: Windows GStreamer
      if: runner.os == 'Windows' && inputs.player == 'gstreamer'
      shell: pwsh
      env:
        GST_MSI_CACHE_HIT: ${{ steps.gst-msi-cache.outputs.cache-hit }}
      run: |
        $ver = '1.26.11'
        $msi = "$env:RUNNER_TEMP\gstreamer.msi"
        $prefix = 'C:\gstreamer\1.0\msvc_x86_64'
        if ($env:GST_MSI_CACHE_HIT -ne 'true' -or -not (Test-Path $msi)) {
          Invoke-WebRequest -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/$ver/msvc/gstreamer-1.0-msvc-x86_64-$ver.msi" -OutFile $msi
        }
        Start-Process msiexec.exe -Wait -ArgumentList "/a `"$msi`" /qn TARGETDIR=$prefix"
        $exe = Get-ChildItem $prefix -Recurse -Filter gst-launch-1.0.exe -ErrorAction SilentlyContinue | Select-Object -First 1
        if (-not $exe) { throw "gst-launch-1.0 missing after MSI extract under $prefix" }
        $bin = $exe.Directory.FullName
        $root = (Resolve-Path (Join-Path $bin '..')).Path
        Add-Content $env:GITHUB_PATH $bin
        Add-Content $env:GITHUB_ENV "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root"
        Add-Content $env:GITHUB_ENV "GSTREAMER_BIN=$bin"
        # ffmpeg for HLS fixture generation — floating latest, uncached (retry CDN blips)
        $ff = "$env:RUNNER_TEMP\ffmpeg"
        $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
        $uri = 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip'
        New-Item -ItemType Directory -Force -Path $ff | Out-Null
        $ok = $false
        foreach ($i in 1..3) {
          try {
            Invoke-WebRequest -Uri $uri -OutFile $zip
            $ok = $true
            break
          } catch {
            Write-Warning "FFmpeg download attempt $i failed: $_"
            Start-Sleep -Seconds (3 * $i)
          }
        }
        if (-not $ok) { throw "Failed to download FFmpeg after retries" }
        Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg-extract" -Force
        $inner = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg-extract" | Select-Object -First 1
        Copy-Item -Recurse -Force "$($inner.FullName)\*" $ff
        Add-Content $env:GITHUB_PATH "$ff\bin"
