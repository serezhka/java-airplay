<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="description" content="Support java-airplay — open-source AirPlay for desktop."/>
  <title>Support java-airplay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg0: #071018;
      --bg1: #0d1c24;
      --ink: #e8f1f4;
      --muted: #8aa0ab;
      --line: rgba(232, 241, 244, 0.12);
      --accent: #3dd6c6;
      --accent-ink: #04201c;
      --glow: rgba(61, 214, 198, 0.22);
      --warn: #f0c674;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background:
        radial-gradient(900px 520px at 12% -10%, var(--glow), transparent 55%),
        radial-gradient(700px 480px at 100% 0%, rgba(90, 140, 180, 0.18), transparent 50%),
        linear-gradient(165deg, var(--bg0), var(--bg1) 55%, #0a151c);
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    main {
      width: min(440px, 100%);
      animation: rise 700ms cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    .brand {
      font-family: Fraunces, Georgia, serif;
      font-size: clamp(2rem, 6vw, 2.55rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
      margin: 0 0 14px;
    }

    .brand span {
      color: var(--accent);
    }

    .lede {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.45;
      max-width: 34ch;
    }

    .amounts {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin: 0 0 12px;
    }

    a.amt {
      appearance: none;
      text-decoration: none;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 14px;
      text-align: center;
      font-weight: 600;
      font-size: 1.2rem;
      letter-spacing: 0.01em;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
    }

    a.amt:hover,
    a.amt:focus-visible {
      transform: translateY(-2px);
      border-color: rgba(61, 214, 198, 0.55);
      background: rgba(61, 214, 198, 0.08);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28);
      outline: none;
    }

    a.amt .euro {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      margin-right: 2px;
    }

    a.custom {
      display: block;
      text-align: center;
      text-decoration: none;
      color: var(--accent-ink);
      background: var(--accent);
      border-radius: 14px;
      padding: 16px 18px;
      font-weight: 600;
      font-size: 1.02rem;
      transition: transform 160ms ease, filter 160ms ease, box-shadow 160ms ease;
      box-shadow: 0 8px 24px rgba(61, 214, 198, 0.25);
      animation: rise 900ms cubic-bezier(.2,.8,.2,1) 80ms both;
    }

    a.custom:hover,
    a.custom:focus-visible {
      transform: translateY(-2px);
      filter: brightness(1.05);
      outline: none;
    }

    .note {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.4;
    }

    .note a {
      color: var(--accent);
      text-decoration: none;
    }

    .note a:hover { text-decoration: underline; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="brand">java-<span>airplay</span></h1>
    <p class="lede">Support open-source AirPlay for desktop. Pick an amount — Stripe handles the rest.</p>

    <div class="amounts" role="group" aria-label="Donation amounts">
      <a class="amt" href="https://donate.stripe.com/6oUfZhg6y1iF5Se9w67EQ00">
        <span class="euro">€</span>5
      </a>
      <a class="amt" href="https://donate.stripe.com/aFafZh2fIgdza8u9w67EQ01">
        <span class="euro">€</span>10
      </a>
      <a class="amt" href="https://donate.stripe.com/3cI7sLcUm8L71BY8s27EQ02">
        <span class="euro">€</span>25
      </a>
      <a class="amt" href="https://donate.stripe.com/14A7sL07AbXj4Oa9w67EQ03">
        <span class="euro">€</span>50
      </a>
    </div>

    <a class="custom" href="https://donate.stripe.com/dRm5kDf2u8L75Se37I7EQ04">
      Enter a custom amount
    </a>

    <p class="note">
      Secure checkout by Stripe (Apple&nbsp;Pay / Google&nbsp;Pay / card).
      <a href="https://github.com/serezhka/java-airplay">Back to the project</a>
    </p>
  </main>
</body>
</html>
