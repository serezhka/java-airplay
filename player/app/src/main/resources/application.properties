# log — INFO is lifecycle only; bodies / wire dumps need DEBUG
logging.file.name=logs/server.log
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.javax.jmdns=WARN
logging.level.com.github.serezhka=INFO
logging.level.io.netty=WARN
logging.level.io.netty.handler.logging.LoggingHandler=DEBUG
logging.level.org.freedesktop.gstreamer=WARN
spring.output.ansi.enabled=ALWAYS
# airplay
airplay.serverName=srzhka
airplay.width=1920
airplay.height=1080
airplay.fps=60
# player (gstreamer, ffmpeg, vlc)
player.implementation=gstreamer
player.tray.enabled=true
# dump
dump.enabled=false
dump.directory=dumps
dump.protocol=true
dump.video=true
dump.audio=true
dump.playlist=true
dump.artwork=true
dump.videoFps=60
